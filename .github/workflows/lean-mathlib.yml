name: Lean Mathlib bridge

on:
  pull_request:
    paths:
      - '.github/workflows/lean-mathlib.yml'
      - 'Makefile'
      - 'formal/check-lean-axioms.py'
      - 'formal/lean-axiom-audit.lean'
      - 'formal/lean-mathlib/**'
      - 'formal/lean/lean-toolchain'
      - 'formal/lean/Usul/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/lean-mathlib.yml'
      - 'Makefile'
      - 'formal/check-lean-axioms.py'
      - 'formal/lean-axiom-audit.lean'
      - 'formal/lean-mathlib/**'
      - 'formal/lean/lean-toolchain'
      - 'formal/lean/Usul/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mathlib:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: make lean-mathlib
      - name: Retain compiled axiom inventory
        uses: actions/upload-artifact@v4
        with:
          name: lean-mathlib-axioms
          path: .cache/lean-axioms/mathlib.json
          include-hidden-files: true
          if-no-files-found: error
