name: IDA authenticated omission observations

on:
  pull_request:
    paths:
      - '.github/workflows/ida-omission-auth.yml'
      - 'Makefile'
      - 'formal/lean/**'
      - 'formal/ida-*.mjs'
      - 'formal/check-ida*.py'
      - 'formal/check-ida-omission-auth.mjs'
      - 'formal/check-lean-axioms.py'
      - 'formal/lean-axiom-audit.lean'
      - 'formal/fixtures/ida-source-auth/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/ida-omission-auth.yml'
      - 'Makefile'
      - 'formal/lean/**'
      - 'formal/ida-*.mjs'
      - 'formal/check-ida*.py'
      - 'formal/check-ida-omission-auth.mjs'
      - 'formal/check-lean-axioms.py'
      - 'formal/lean-axiom-audit.lean'
      - 'formal/fixtures/ida-source-auth/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authenticated-omission:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Verify authenticated omission observations
        run: make ida-omission-auth
      - name: Require a receipt for the checked revision
        env:
          EXPECTED_ACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          report = json.loads(Path(".cache/ida-omission-auth/report.json").read_text())
          if (head != os.environ["EXPECTED_ACT_HEAD"] or report.get("revision") != head
                  or report.get("status") != "passed" or report.get("inputs_match_head") is not True):
              raise SystemExit("Omission authentication receipt does not verify the checked revision")
          PY
      - name: Retain verification receipt
        uses: actions/upload-artifact@v4
        with:
          name: ida-omission-auth-verification
          path: .cache/ida-omission-auth/
          include-hidden-files: true
          if-no-files-found: error
