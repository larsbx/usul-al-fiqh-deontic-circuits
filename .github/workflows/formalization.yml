name: Formalization pipeline

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  corpus:
    name: Corpus pipeline (pytest + schema validation + vectors)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest jsonschema numpy pillow
      - name: Replay locked M5 command-schema evidence
        run: cd pipeline && python -m usul_corpus m5-commands --fetch-source
      - run: make test validate generated

  lean:
    name: Lean 4 kernel (no sorry)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: make lean
      - name: Reject sorry
        run: "! grep -rn --include=*.lean -w sorry formal/lean/Usul formal/lean/UsulTest formal/lean/Hadith formal/lean/HadithTest"

  tla:
    name: TLA+ model checking (bounded)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: make tla
