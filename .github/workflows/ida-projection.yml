name: IDA scoped contextual projection

on:
  pull_request:
    paths:
      - '.github/workflows/ida-projection.yml'
      - 'Makefile'
      - 'formal/lean/**'
      - 'formal/quint/ida-projection*.qnt'
      - 'formal/quint/package*.json'
      - 'formal/check-ida*.py'
      - 'formal/check-lean-axioms.py'
      - 'formal/lean-axiom-audit.lean'
      - 'formal/lean-proof-claims.json'
      - 'docs/research/ida-projection.md'
      - 'docs/plain-english/UsulTest/IDAProjection*.md'
      - 'docs/plain-english/scripts/ExportIDAProjection.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/ida-projection.yml'
      - 'Makefile'
      - 'formal/lean/**'
      - 'formal/quint/ida-projection*.qnt'
      - 'formal/quint/package*.json'
      - 'formal/check-ida*.py'
      - 'formal/check-lean-axioms.py'
      - 'formal/lean-axiom-audit.lean'
      - 'formal/lean-proof-claims.json'
      - 'docs/research/ida-projection.md'
      - 'docs/plain-english/UsulTest/IDAProjection*.md'
      - 'docs/plain-english/scripts/ExportIDAProjection.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  substitution:
    name: ACT-03 fivefold proofs, Quint comparison, and negative controls
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: formal/quint/package-lock.json
      - name: Install elan
        run: |
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "$RUNNER_TEMP/ida-projection-elan-init.sh"
          sh "$RUNNER_TEMP/ida-projection-elan-init.sh" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Install pinned Quint dependencies
        working-directory: formal/quint
        run: npm ci
      - name: Verify ACT-03
        run: make ida-projection
      - name: Require exact-head receipt
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          report = json.loads(Path(".cache/ida-projection/report.json").read_text())
          if (head != os.environ["EXPECTED_HEAD"] or report.get("revision") != head
                  or report.get("status") != "passed" or report.get("inputs_match_head") is not True):
              raise SystemExit("ACT-03 receipt does not verify the checked revision")
          print(f"ACT-03 receipt verifies {head}")
          PY
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ida-projection-verification
          path: .cache/ida-projection/
          include-hidden-files: true
          if-no-files-found: error
