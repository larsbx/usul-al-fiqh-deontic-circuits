name: Fixture expectations

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fixtures-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  swipl:
    name: SWI-Prolog fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install SWI-Prolog
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q swi-prolog-nox
          swipl --version

      - name: Run runner self-tests, fixtures, and guard mutants
        run: tests/run_all.sh

      - name: "Oracle: Prolog mirror of the Lean ḥadīth kernel over the corpus"
        run: formal/oracle/run_all.sh
