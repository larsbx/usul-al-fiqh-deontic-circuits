name: IDA act registry and bound source admission

on:
  pull_request:
    paths:
      - '.github/workflows/ida-act-registry.yml'
      - 'Makefile'
      - 'formal/lean/**'
      - 'formal/quint/ida*.qnt'
      - 'formal/quint/package*.json'
      - 'formal/check-ida*.py'
      - 'formal/ida-act-registry*'
      - 'formal/check-lean-axioms.py'
      - 'formal/lean-axiom-audit.lean'
      - 'formal/fixtures/ida-act-registry/**'
      - 'corpus/proposals/fiqh-acts/reference.json'
      - 'docs/research/ida-*.md'
      - 'docs/plain-english/**/IDAActRegistry*.md'
      - 'docs/plain-english/scripts/*IDAActRegistry*.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/ida-act-registry.yml'
      - 'Makefile'
      - 'formal/lean/**'
      - 'formal/quint/ida*.qnt'
      - 'formal/quint/package*.json'
      - 'formal/check-ida*.py'
      - 'formal/ida-act-registry*'
      - 'formal/check-lean-axioms.py'
      - 'formal/lean-axiom-audit.lean'
      - 'formal/fixtures/ida-act-registry/**'
      - 'corpus/proposals/fiqh-acts/reference.json'
      - 'docs/research/ida-*.md'
      - 'docs/plain-english/**/IDAActRegistry*.md'
      - 'docs/plain-english/scripts/*IDAActRegistry*.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  registry:
    name: ACT-01 Lean, Quint, canonical wire, and source binding
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: formal/quint/package-lock.json
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Install pinned Quint dependencies
        working-directory: formal/quint
        run: npm ci
      - name: Verify the ACT-01 implementation
        run: make ida-registry
      - name: Require receipt for the checked revision
        env:
          EXPECTED_ACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          report = json.loads(Path(".cache/ida-act-registry/report.json").read_text())
          if (head != os.environ["EXPECTED_ACT_HEAD"] or report.get("revision") != head
                  or report.get("status") != "passed" or report.get("inputs_match_head") is not True):
              raise SystemExit("ACT-01 receipt does not verify the checked revision")
          print(f"ACT-01 receipt verifies {head}")
          PY
      - name: Retain reproducible verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ida-act-registry-verification
          path: .cache/ida-act-registry/
          include-hidden-files: true
          if-no-files-found: error
