name: Fixture expectations

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fixtures-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lean:
    name: Lean fixtures, migration coverage, mutants, and axiom audit
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Install and materialize the pinned Lean toolchain
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          cd formal/lean
          "$HOME/.elan/bin/lake" env lean --version

      - name: Run native Lean fixtures and all acceptance controls
        run: make fixtures

      - name: Require a receipt for this exact head
        env:
          FIXTURE_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          report = json.loads(Path(".cache/lean-fixtures/report.json").read_text())
          if (head != os.environ["FIXTURE_EXPECTED_HEAD"] or report.get("revision") != head
                  or report.get("status") != "passed" or report.get("inputs_match_head") is not True):
              raise SystemExit("Fixture receipt does not verify the requested revision")
          if any(report.get("runtime_overrides", {}).values()):
              raise SystemExit("Hosted acceptance requires the unmodified toolchain environment")
          print(f"Lean fixture receipt verifies {head}")
          PY

      - name: Retain the fixture table, mutation evidence, and compiled audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lean-fixture-verification
          path: .cache/lean-fixtures/
          include-hidden-files: true
          if-no-files-found: error

  independent-reference:
    name: Independent Prolog oracles and migration replay
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Record the exact checkout
        env:
          FIXTURE_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/ida-prolog-evidence"
          head=$(git rev-parse HEAD)
          printf '%s\n' "$head" | tee "$RUNNER_TEMP/ida-prolog-evidence/revision.txt"
          test "$head" = "$FIXTURE_EXPECTED_HEAD"
          git diff --exit-code HEAD
          cp tests/lean-fixture-reference.json "$RUNNER_TEMP/ida-prolog-evidence/"

      - name: Test provisioning failure and version rejection
        run: |
          bash .github/scripts/test-fixture-swipl-provisioning.sh 2>&1 |
            tee "$RUNNER_TEMP/ida-prolog-evidence/controls.log"

      - name: Provision pinned SWI-Prolog
        id: prolog
        run: |
          bash .github/scripts/provision-fixture-swipl.sh 2>&1 |
            tee "$RUNNER_TEMP/ida-prolog-evidence/runtime.log"

      - name: Independently replay the legacy migration reference
        run: |
          make fixtures-legacy 2>&1 |
            tee "$RUNNER_TEMP/ida-prolog-evidence/migration.log"

      - name: "Oracle: Prolog mirror of the Lean ḥadīth kernel over the corpus"
        if: ${{ !cancelled() && steps.prolog.outcome == 'success' }}
        run: |
          formal/oracle/run_all.sh 2>&1 |
            tee "$RUNNER_TEMP/ida-prolog-evidence/oracle.log"

      - name: Retain independent Prolog evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-prolog-verification
          path: ${{ runner.temp }}/ida-prolog-evidence/
          if-no-files-found: error
