name: IDA ACT-08 structural examples

on:
  pull_request:
    paths:
      - '.github/workflows/ida-*.yml'
      - 'Makefile'
      - 'formal/lean/**'
      - 'formal/quint/ida*.qnt'
      - 'formal/quint/package*.json'
      - 'formal/check-ida*.py'
      - 'formal/test-ida-pilot.py'
      - 'formal/ida-act-registry-wire.py'
      - 'formal/check-lean-axioms.py'
      - 'formal/lean-axiom-audit.lean'
      - 'formal/lean-proof-claims.json'
      - 'corpus/proposals/fiqh-acts/reference.json'
      - 'docs/research/ida-structural-cases.md'
      - 'docs/plain-english/UsulTest/IDAStructuralCases*.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/ida-*.yml'
      - 'Makefile'
      - 'formal/lean/**'
      - 'formal/quint/ida*.qnt'
      - 'formal/quint/package*.json'
      - 'formal/check-ida*.py'
      - 'formal/test-ida-pilot.py'
      - 'formal/ida-act-registry-wire.py'
      - 'formal/check-lean-axioms.py'
      - 'formal/lean-axiom-audit.lean'
      - 'formal/lean-proof-claims.json'
      - 'corpus/proposals/fiqh-acts/reference.json'
      - 'docs/research/ida-structural-cases.md'
      - 'docs/plain-english/UsulTest/IDAStructuralCases*.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structural:
    name: ACT-08 structural proofs, independent model, and adverse controls
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: formal/quint/package-lock.json
      - name: Install elan
        run: |
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "$RUNNER_TEMP/ida-elan-init.sh"
          sh "$RUNNER_TEMP/ida-elan-init.sh" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Install pinned Quint dependencies
        working-directory: formal/quint
        run: npm ci
      - name: Verify structural examples
        run: make ida-structural-cases
      - name: Require receipt for the checked revision
        env:
          EXPECTED_STRUCTURAL_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          report = json.loads(Path(".cache/ida-structural-cases/report.json").read_text())
          if (head != os.environ["EXPECTED_STRUCTURAL_HEAD"] or report.get("revision") != head
                  or report.get("status") != "passed" or report.get("inputs_match_head") is not True):
              raise SystemExit("Structural receipt does not verify the checked revision")
          print(f"ACT-08 structural receipt verifies {head}")
          PY
      - name: Check documentation and import boundaries
        run: |
          python3 -m pip install pytest jsonschema
          cd pipeline
          python3 -m pytest -q tests/test_plain_english.py tests/test_roadmap.py tests/test_layers.py
      - name: Retain structural evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ida-structural-cases-verification
          path: .cache/ida-structural-cases/
          include-hidden-files: true
          if-no-files-found: error

